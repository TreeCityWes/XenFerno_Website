<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Sparx & XenBurner - DeFi platform"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Sparx & XenBurner" />
    <meta property="og:description" content="Earn rewards and provide liquidity with SPARX and XBURN." />
    <meta property="og:image" content="%PUBLIC_URL%/1500x500-socialmedia.png" />
    <meta property="og:image:width" content="1500" />
    <meta property="og:image:height" content="500" />
    <meta property="og:url" content="https://sparx.burnxen.com" /> <!-- Replace with actual deployed URL -->
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sparx & XenBurner" />
    <meta name="twitter:description" content="Earn rewards and provide liquidity with SPARX and XBURN." />
    <meta name="twitter:image" content="%PUBLIC_URL%/1500x500-socialmedia.png" />

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

  </body>
</html>
